services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: scms_db
      POSTGRES_USER: scms_admin
      POSTGRES_PASSWORD: admin.123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_NAME: scms_db
      DATABASE_USER: scms_admin
      DATABASE_PASSWORD: admin.123
      DATABASE_HOST: db
      DATABASE_PORT: 5432

volumes:
  postgres_data:
