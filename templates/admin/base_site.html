{% extends "admin/base.html" %}
{% load static i18n grp_tags log %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/custom_admin.css' %}?v=20251004">
    <!-- Intro.js CSS (CDN) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intro.js/minified/introjs.min.css">
    <style>
      /* small button styling fallback */
      .eduflow-tour-btn { font-size:13px; }
    </style>
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <!-- Load our consolidated admin tour script (it loads intro.js if needed) -->
    <script src="{% static 'js/admin_tour.js' %}"></script>
{% endblock %}

{% block footer %}
    {{ block.super }}
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        // change "View site" -> "Home" (existing)
        var tools = document.getElementById('grp-user-tools');
        if (tools) {
            var links = tools.getElementsByTagName('a');
            for (var i = 0; i < links.length; i++) {
                var a = links[i];
                var txt = a.textContent.trim();
                var href = a.getAttribute('href') || '';
                if (txt === 'View site' || href === '/' || href === window.location.origin + '/') {
                    a.textContent = 'Home';
                    break;
                }
            }
        }

        // change admin page header "Site administration" -> "Edu-flow Dashboard"
        var header = document.querySelector('#grp-content-title header h1');
        if (!header) {
            header = document.querySelector('header h1'); // fallback
        }
        if (header) {
            header.textContent = 'Edu-flow Dashboard';
        }

        // also update browser tab title if desired
        if (document.title && document.title.indexOf('Site administration') !== -1) {
            document.title = document.title.replace('Site administration', 'Edu-flow Dashboard');
        }
    });
    </script>
{% endblock %}
