{% extends 'accounts/base_auth.html' %}
{% block content %}

<a href="/" class="back-link">
  <i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="auth-header">
  <div class="heading">Select Your Role</div>
  <div class="sub">{{ org.name }}</div>
</div>

<form method="post">
  {% csrf_token %}
  
  <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
    <label class="role-card">
      <input type="radio" name="role" value="ORG_ADMIN" required>
      <div class="role-content">
        <div class="role-icon">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div class="role-info">
          <div class="role-title">Organisation Admin</div>
          <div class="role-desc">Manage organisation settings, users, and permissions</div>
        </div>
      </div>
    </label>
    
    <label class="role-card">
      <input type="radio" name="role" value="TEACHER" required>
      <div class="role-content">
        <div class="role-icon">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <div class="role-info">
          <div class="role-title">Teacher</div>
          <div class="role-desc">Create courses, manage classes, and track student progress</div>
        </div>
      </div>
    </label>
    
    <label class="role-card">
      <input type="radio" name="role" value="STUDENT" required>
      <div class="role-content">
        <div class="role-icon">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div class="role-info">
          <div class="role-title">Student</div>
          <div class="role-desc">Access courses, complete assignments, and view grades</div>
        </div>
      </div>
    </label>
  </div>
  
  <button class="button" type="submit">Continue to Login</button>
</form>

<style>
.role-card{
  display:flex;
  align-items:center;
  padding:16px;
  border:2px solid #e5e7eb;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.2s;
  background:white;
}

.role-card:hover{
  border-color:#667eea;
  background:#f9fafb;
}

.role-card input[type="radio"]{
  width:20px;
  height:20px;
  margin:0;
  padding:0;
  cursor:pointer;
  accent-color:#667eea;
}

.role-card input[type="radio"]:checked ~ .role-content{
  opacity:1;
}

.role-card:has(input[type="radio"]:checked){
  border-color:#667eea;
  background:#f0f4ff;
}

.role-content{
  display:flex;
  align-items:center;
  gap:14px;
  flex:1;
  margin-left:12px;
  opacity:0.8;
  transition:opacity 0.2s;
}

.role-icon{
  width:44px;
  height:44px;
  border-radius:8px;
  background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:20px;
  flex-shrink:0;
}

.role-info{
  flex:1;
}

.role-title{
  font-size:15px;
  font-weight:600;
  color:#111827;
  margin-bottom:4px;
}

.role-desc{
  font-size:12px;
  color:#6b7280;
  line-height:1.4;
}
</style>

{% endblock %}
