{% extends 'accounts/base_auth.html' %}
{% block content %}

<style>
.dashboard-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 30px;
}
.dashboard-title {
  font-size: 2rem;
  font-weight: 700;
  color: #1e293b;
  display: flex;
  align-items: center;
  gap: 12px;
}
.dashboard-actions {
  display: flex;
  gap: 12px;
}
.dashboard-actions a {
  background: #2563eb;
  color: #fff;
  padding: 8px 18px;
  border-radius: 5px;
  font-weight: 500;
  text-decoration: none;
  font-size: 14px;
  transition: background 0.2s;
}
.dashboard-actions a:hover {
  background: #1e40af;
}
.dashboard-cards {
  display: flex;
  gap: 24px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.dashboard-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 24px 32px;
  min-width: 220px;
  flex: 1 1 220px;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 2px 8px 0 rgba(30,41,59,0.04);
}
.dashboard-card .icon {
  font-size: 2.2rem;
  color: #2563eb;
  background: #eff6ff;
  border-radius: 50%;
  padding: 12px;
}
.dashboard-card .info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.dashboard-card .info .label {
  font-size: 13px;
  color: #64748b;
  font-weight: 500;
}
.dashboard-card .info .value {
  font-size: 1.3rem;
  font-weight: 700;
  color: #1e293b;
}
.dashboard-section {
  margin-top: 40px;
}
.dashboard-section-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #334155;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dashboard-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 8px 0 rgba(30,41,59,0.03);
}
.dashboard-table th, .dashboard-table td {
  padding: 12px 16px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  font-size: 14px;
}
.dashboard-table th {
  background: #f1f5f9;
  color: #475569;
  font-weight: 600;
}
.dashboard-table tr:last-child td {
  border-bottom: none;
}
@media (max-width: 900px) {
  .dashboard-cards {
    flex-direction: column;
    gap: 16px;
  }
  .dashboard-card {
    min-width: 0;
    padding: 18px 16px;
  }
}
</style>

<div class="dashboard-header">
  <div class="dashboard-title">
    <i class="fa-solid fa-building-columns"></i>
    Admin Dashboard
  </div>
  <div class="dashboard-actions">
    <a href="{% url 'logout' %}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    <a href="/"><i class="fa-solid fa-house"></i> Home</a>
  </div>
</div>

<div class="dashboard-cards">
  <div class="dashboard-card">
    <span class="icon"><i class="fa-solid fa-users"></i></span>
    <div class="info">
      <span class="label">Total Students</span>
      <span class="value">--</span>
    </div>
  </div>
  <div class="dashboard-card">
    <span class="icon"><i class="fa-solid fa-chalkboard-user"></i></span>
    <div class="info">
      <span class="label">Total Teachers</span>
      <span class="value">--</span>
    </div>
  </div>
  <div class="dashboard-card">
    <span class="icon"><i class="fa-solid fa-user-shield"></i></span>
    <div class="info">
      <span class="label">Organisation Status</span>
      <span class="value">Active</span>
    </div>
  </div>
  <div class="dashboard-card">
    <span class="icon"><i class="fa-solid fa-layer-group"></i></span>
    <div class="info">
      <span class="label">Organisation Size</span>
      <span class="value">--</span>
    </div>
  </div>
</div>

<div class="dashboard-section">
  <div class="dashboard-section-title">
    <i class="fa-solid fa-user-plus"></i>
    Recent Registrations
  </div>
  <table class="dashboard-table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Role</th>
        <th>Email</th>
        <th>Joined</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>--</td>
        <td>--</td>
        <td>--</td>
        <td>--</td>
      </tr>
    </tbody>
  </table>
</div>
