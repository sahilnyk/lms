{% extends 'accounts/base_auth.html' %}
{% block content %}

<div class="auth-header">
  <div class="heading">Enter Organisation</div>
  <div class="sub">Enter your organisation slug to continue</div>
</div>

<div id="err" class="form-error" style="display:none"></div>

<form onsubmit="event.preventDefault(); goLogin();">
  <div class="label">Organisation Slug</div>
  <div class="input-wrapper">
    <i class="fa-solid fa-building"></i>
    <input id="slugBox" 
           placeholder="e.g., abc-university" 
           oninput="document.getElementById('err').style.display='none'"
           autocomplete="off"
           required>
  </div>

  <button class="button" type="submit">Continue</button>
</form>

<div class="auth-footer">
  New user? <a href="{% url 'register_selector' %}">Register here</a>
</div>

<script>
async function goLogin(){
  const slug = document.getElementById("slugBox").value.trim();
  const err = document.getElementById("err");

  if(!slug){
    err.innerText = "Organisation slug is required";
    err.style.display = "block";
    return;
  }

  const res = await fetch(`/check-org/${slug}/`);
  const data = await res.json();

  if(!data.exists){
    err.innerText = "Organisation not found. Please check your slug or contact your administrator.";
    err.style.display = "block";
    return;
  }

  window.location.href = `/${slug}/role/`;
}
</script>

{% endblock %}
