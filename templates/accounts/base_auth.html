{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>{{ title|default:"Eduflow" }}</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body {
 font-family:'Inter',sans-serif;
 position: relative;
 background: url("/static/images/bg-edu.jpeg") no-repeat center center fixed !important;
 background-size: cover !important;
}

body::after{
 content:"";
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:rgba(255,255,255,0.95)!important;
 z-index:-1;
}

.container{
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
}

.box{
 width:420px;
 max-width:95%;
 background:white;
 padding:34px 30px 25px 30px;
 border-radius:7px;
 border:1px solid #d6dde7;
 box-shadow:0 20px 65px rgba(0,0,0,0.30);
}

.logo{
 text-align:center;
}

.logo img{
 width:180px;
 max-width:100%;
 height:auto;
}

.heading{
 text-align:center;
 font-size:18px;
 font-weight:700;
 margin-top:7px;
 color:#111827;
}

.sub{
 text-align:center;
 font-size:12px;
 color:#6b7280;
 margin-bottom:18px;
}

.label{
 margin-top:10px;
 font-size:12px;
 color:#374151;
 font-weight:600;
}

.input-wrapper{
 position:relative;
 width:100%;
 margin-top:6px;
}

.input-wrapper i{
 position:absolute;
 top:50%;
 left:10px;
 transform:translateY(-50%);
 color:#6b7280;
 font-size:14px;
}

input{
 width:100%;
 padding:10px 12px 10px 34px;
 border:1px solid #cbd5e1;
 border-radius:4px;
 background:#f8fafc;
 font-size:12px;
}

input:focus{
 outline:none;
 background:white;
 border-color:#4a5b73;
}

.button{
 width:100%;
 border:none;
 margin-top:16px;
 padding:10px;
 color:white;
 border-radius:4px;
 cursor:pointer;
 font-size:12px;
 font-weight:600;
 background:linear-gradient(to right,#64748b,#1f2937);
}

.button:hover{
 background:linear-gradient(to right,#475569,#0f172a);
}

.form-error{
 width:100%;
 background:#fde8e8;
 border:1px solid #e3b3b3;
 color:#8b0000;
 padding:8px;
 font-size:11px;
 border-radius:4px;
 text-align:center;
 font-weight:600;
 margin-bottom:10px;
}

.register{
 text-align:center;
 margin-top:12px;
 font-size:12px;
 color:#374151;
}

.register a{
 color:#1f3fd6;
 text-decoration:none;
 cursor:pointer;
}

.register a:hover{
 text-decoration:underline;
}

.register i{
 margin-left:3px;
 color:#1f3fd6;
}

</style>
</head>

<body>
<div class="container">
 <div class="box">
  <div class="logo">
     <img src="{% static 'images/FinalLogo.png' %}">
  </div>

  {% block content %}{% endblock %}
 </div>
</div>
</body>
</html>
