{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>{{ title|default:"Eduflow" }}</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body {
 font-family:'Inter',sans-serif;
 background:#f8fafc;
 overflow-x:hidden;
}

.auth-wrapper{
 display:flex;
 min-height:100vh;
}

.auth-left{
 flex:1;
 background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:40px;
 position:relative;
 overflow:hidden;
}

.auth-left::before{
 content:"";
 position:absolute;
 width:400px;
 height:400px;
 background:rgba(255,255,255,0.1);
 border-radius:50%;
 top:-100px;
 left:-100px;
}

.auth-left::after{
 content:"";
 position:absolute;
 width:300px;
 height:300px;
 background:rgba(255,255,255,0.1);
 border-radius:50%;
 bottom:-80px;
 right:-80px;
}

.auth-branding{
 position:relative;
 z-index:1;
 text-align:center;
 color:white;
}

.auth-branding img{
 width:200px;
 max-width:100%;
 margin-bottom:30px;
 filter:brightness(0) invert(1);
}

.auth-branding h1{
 font-size:32px;
 font-weight:700;
 margin-bottom:12px;
 line-height:1.2;
}

.auth-branding p{
 font-size:16px;
 opacity:0.9;
 line-height:1.6;
 max-width:400px;
 margin:0 auto;
}

.auth-right{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:40px;
 background:white;
}

.auth-container{
 width:100%;
 max-width:440px;
}

.auth-header{
 margin-bottom:32px;
}

.auth-header .logo{
 display:none;
}

.auth-header .heading{
 font-size:28px;
 font-weight:700;
 color:#111827;
 margin-bottom:8px;
 line-height:1.2;
}

.auth-header .sub{
 font-size:14px;
 color:#6b7280;
 line-height:1.5;
}

.label{
 display:block;
 margin-bottom:8px;
 font-size:13px;
 color:#374151;
 font-weight:600;
}

.input-wrapper{
 position:relative;
 width:100%;
 margin-bottom:16px;
}

.input-wrapper i{
 position:absolute;
 top:50%;
 left:14px;
 transform:translateY(-50%);
 color:#9ca3af;
 font-size:15px;
}

input, textarea, select{
 width:100%;
 padding:12px 14px 12px 42px;
 border:1px solid #d1d5db;
 border-radius:6px;
 background:#ffffff;
 font-size:14px;
 color:#111827;
 transition:all 0.2s;
 font-family:'Inter',sans-serif;
}

input:focus, textarea:focus, select:focus{
 outline:none;
 border-color:#667eea;
 box-shadow:0 0 0 3px rgba(102, 126, 234, 0.1);
}

input::placeholder{
 color:#9ca3af;
}

textarea{
 resize:vertical;
 min-height:80px;
 padding:12px 14px;
}

.button{
 width:100%;
 border:none;
 padding:12px 20px;
 color:white;
 border-radius:6px;
 cursor:pointer;
 font-size:14px;
 font-weight:600;
 background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 transition:all 0.3s;
 margin-top:8px;
}

.button:hover{
 transform:translateY(-1px);
 box-shadow:0 10px 20px rgba(102, 126, 234, 0.3);
}

.button:active{
 transform:translateY(0);
}

.form-error{
 width:100%;
 background:#fef2f2;
 border:1px solid #fecaca;
 color:#991b1b;
 padding:12px 14px;
 font-size:13px;
 border-radius:6px;
 margin-bottom:16px;
 line-height:1.5;
}

.form-success{
 width:100%;
 background:#f0fdf4;
 border:1px solid #bbf7d0;
 color:#166534;
 padding:12px 14px;
 font-size:13px;
 border-radius:6px;
 margin-bottom:16px;
 line-height:1.5;
}

.auth-footer{
 text-align:center;
 margin-top:24px;
 font-size:13px;
 color:#6b7280;
}

.auth-footer a{
 color:#667eea;
 text-decoration:none;
 font-weight:600;
}

.auth-footer a:hover{
 text-decoration:underline;
}

.auth-footer i{
 margin-left:4px;
 font-size:11px;
}

.back-link{
 display:inline-flex;
 align-items:center;
 gap:6px;
 color:#667eea;
 text-decoration:none;
 font-size:13px;
 font-weight:600;
 margin-bottom:20px;
}

.back-link:hover{
 text-decoration:underline;
}

.back-link i{
 font-size:12px;
}

@media (max-width: 768px) {
 .auth-wrapper{
  flex-direction:column;
 }
 
 .auth-left{
  min-height:200px;
  padding:30px 20px;
 }
 
 .auth-branding h1{
  font-size:24px;
 }
 
 .auth-branding p{
  font-size:14px;
 }
 
 .auth-right{
  padding:30px 20px;
 }
 
 .auth-header .logo{
  display:block;
  text-align:center;
  margin-bottom:24px;
 }
 
 .auth-header .logo img{
  width:140px;
 }
 
 .auth-branding img{
  display:none;
 }
}

</style>
</head>

<body>
<div class="auth-wrapper">
 <div class="auth-left">
  <div class="auth-branding">
   <img src="{% static 'images/FinalLogo.png' %}" alt="Eduflow">
   <h1>Welcome to Eduflow</h1>
   <p>Empowering education through seamless digital learning management</p>
  </div>
 </div>
 
 <div class="auth-right">
  <div class="auth-container">
   {% block content %}{% endblock %}
  </div>
 </div>
</div>
</body>
</html>
